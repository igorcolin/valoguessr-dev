(function () {
	// French if the browser is; the game picks its own language later
	if ((navigator.language || '').toLowerCase().startsWith('fr')) {
		document.getElementById('tagline').textContent = 'Entraînement aux callouts';
		document.getElementById('label').textContent = 'Chargement';
	}
	// a random map's splash art in the background
	const splashes = ['ascent','haven','bind','split','fracture','breeze','abyss','lotus','sunset','pearl'];
	if (splashes.length) {
		const bg = document.getElementById('status-bg');
		const img = new Image();
		img.onload = () => { bg.style.backgroundImage = 'url(' + img.src + ')'; bg.classList.add('on'); };
		img.src = 'splash/' + splashes[Math.floor(Math.random() * splashes.length)] + '.jpg';
	}
}());

function setProgress(f) {
	const track = document.getElementById('track');
	const fill = document.getElementById('fill');
	const pct = document.getElementById('pct');
	if (f < 0) {
		track.classList.add('busy');
		pct.textContent = '';
		return;
	}
	track.classList.remove('busy');
	fill.style.width = (100 * Math.min(1, f)).toFixed(1) + '%';
	pct.textContent = Math.floor(100 * f) + ' %';
}
